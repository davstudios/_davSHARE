[package]
name = "davshare"
version = "26.10.2"
description = "_davSHARE — local cross-platform file sharing by _davstudios."
authors = ["_davstudios"]
license = "MIT"
homepage = "https://davstudios.it"
edition = "2021"
rust-version = "1.90"

[lib]
name = "davshare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["image-ico"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
serde = { version = "1", features = ["derive"] }
rand = "0.8"
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

zip = "0.6"
fs2 = "0.4"
